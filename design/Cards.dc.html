<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GMGN card overlay</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#07090D}
a{color:#B8F04A}a:hover{color:#D4FF7A}
.n{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 460px; height: 420px; box-sizing: border-box; padding: 20px; background: #07090D; font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #E6E9EF; display: flex; flex-direction: column; gap: 12px">
  <div style="font-size: 10.5px; color: #8A93A4; letter-spacing: .08em">GMGN TRENCHES · CARD STATES</div>

  <div style="position: relative; background: #11151D; border: 1px solid #1E2531; border-radius: 10px; padding: 12px; display: flex; gap: 10px; height: 92px; box-sizing: border-box; box-shadow: inset 3px 0 0 #B8F04A">
    <div style="width: 44px; height: 44px; border-radius: 10px; background: #1E2531"></div>
    <div style="display: flex; flex-direction: column; gap: 3px">
      <div style="font-weight: 700">JEVABLE <span style="color: #8A93A4; font-weight: 400">· 3m</span></div>
      <div class="n" style="color: #8A93A4; font-size: 11px">MC $6.97K · V $4.1K</div>
    </div>
    <div style="position: absolute; right: 8px; bottom: 8px; display: flex; gap: 4px; align-items: center">
      <span class="n" style="background: #0B1A14; border: 1px solid #2E9C6E; color: #7FF0BF; border-radius: 6px; padding: 1px 6px; font-size: 10.5px; font-weight: 600">◎ 0.55 · +31%</span>
      <button class="n" style="background: #5C1414; border: 1px solid #F05252; color: #FFE4E4; border-radius: 6px; padding: 1px 7px; font-size: 10.5px; font-weight: 700">⚡ 0.1 ÷3</button>
    </div>
  </div>

  <div style="position: relative; background: #11151D; border: 1px solid #1E2531; border-radius: 10px; padding: 12px; display: flex; gap: 10px; height: 92px; box-sizing: border-box">
    <div style="width: 44px; height: 44px; border-radius: 10px; background: #1E2531"></div>
    <div style="display: flex; flex-direction: column; gap: 3px">
      <div style="font-weight: 700">MEOWFART <span style="color: #8A93A4; font-weight: 400">· 41s</span></div>
      <div class="n" style="color: #8A93A4; font-size: 11px">MC $46.3K · V $22K</div>
    </div>
    <div style="position: absolute; right: 8px; bottom: 8px; display: flex; gap: 4px; align-items: center">
      <button class="n" style="background: #2B2410; border: 1px solid #C9A227; color: #FFE08A; border-radius: 6px; padding: 1px 7px; font-size: 10.5px; font-weight: 700">⚡ 0.5% · ≈1.6◎</button>
    </div>
  </div>

  <div style="position: relative; background: #11151D; border: 1px solid #1E2531; border-radius: 10px; padding: 12px; display: flex; gap: 10px; height: 92px; box-sizing: border-box">
    <div style="width: 44px; height: 44px; border-radius: 10px; background: #1E2531"></div>
    <div style="display: flex; flex-direction: column; gap: 3px">
      <div style="font-weight: 700">PAPERCAT <span style="color: #8A93A4; font-weight: 400">· 12m</span></div>
      <div class="n" style="color: #8A93A4; font-size: 11px">MC $18.2K · V $9.8K</div>
    </div>
    <div style="position: absolute; right: 8px; bottom: 8px; display: flex; gap: 4px; align-items: center">
      <button class="n" style="background: #10233A; border: 1px solid #3B82F6; color: #CFE3FF; border-radius: 6px; padding: 1px 7px; font-size: 10.5px; font-weight: 700">⚡ 0.1 paper</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":460,"height":420}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
