<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Relay approach</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0C0D10}
.n{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
</style>
</helmet>
<div style="width: 860px; height: 1000px; box-sizing: border-box; background: #0B0C0F; border: 1px solid #1F2228; border-radius: 12px; font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #E6E8EC; padding: 20px; display: flex; flex-direction: column; gap: 18px">

  <div style="display: flex; align-items: center; gap: 10px"><b style="font-size: 15px">How the two tabs talk · today vs proposed</b></div>

  <svg width="820" height="250" viewBox="0 0 820 250" style="font-family: 'IBM Plex Sans', sans-serif">
    <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8z" fill="#8B919C"></path></marker>
      <marker id="g" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8z" fill="#B8F04A"></path></marker></defs>
    <rect x="0" y="70" width="170" height="110" rx="12" fill="#17191E" stroke="#2C3038"></rect>
    <text x="16" y="96" fill="#E6E8EC" font-weight="700" font-size="13">GMGN tab</text>
    <text x="16" y="118" fill="#8B919C" font-size="11">widget · cards · bar</text>
    <text x="16" y="136" fill="#8B919C" font-size="11">price from the title</text>
    <text x="16" y="164" fill="#B8F04A" font-size="11">sends ping + calls</text>

    <rect x="280" y="70" width="190" height="110" rx="12" fill="#14161A" stroke="#4E6420" stroke-dasharray="4 3"></rect>
    <text x="296" y="96" fill="#E6E8EC" font-weight="700" font-size="13">Tampermonkey storage</text>
    <text x="296" y="118" fill="#8B919C" font-size="11" class="n">agRpc → agAck → agRpcRes</text>
    <text x="296" y="136" fill="#8B919C" font-size="11" class="n">agPing ↔ agPong (RTT)</text>
    <text x="296" y="154" fill="#8B919C" font-size="11" class="n">agHealth {session, socket, v}</text>
    <text x="296" y="172" fill="#8B919C" font-size="11" class="n">agRelay lease (1 owner)</text>

    <rect x="580" y="20" width="230" height="100" rx="12" fill="#17191E" stroke="#B8F04A"></rect>
    <text x="596" y="46" fill="#E6E8EC" font-weight="700" font-size="13">Backtester tab · relay owner</text>
    <text x="596" y="68" fill="#8B919C" font-size="11">answers calls · runs orders</text>
    <text x="596" y="86" fill="#8B919C" font-size="11">AG socket · session check</text>
    <text x="596" y="104" fill="#8B919C" font-size="11">worker beat + Web Lock keep-alive</text>
    <rect x="580" y="140" width="230" height="56" rx="12" fill="#121317" stroke="#2C3038"></rect>
    <text x="596" y="164" fill="#8B919C" font-weight="600" font-size="12">2nd backtester tab · standby</text>
    <text x="596" y="182" fill="#6E7480" font-size="11">ignores calls, takes over in 8 s</text>

    <line x1="172" y1="125" x2="276" y2="125" stroke="#B8F04A" stroke-width="2" marker-end="url(#g)"></line>
    <line x1="472" y1="105" x2="576" y2="78" stroke="#B8F04A" stroke-width="2" marker-end="url(#g)"></line>
    <line x1="472" y1="150" x2="576" y2="166" stroke="#3A3F48" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#a)"></line>

    <path d="M85 182 C 85 240, 700 240, 700 200" fill="none" stroke="#F2B84B" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"></path>
    <text x="300" y="242" fill="#F2B84B" font-size="11">no ack in 1.2 s → direct HTTPS to AG (never twice for an order)</text>
  </svg>

  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px">
    <sc-for list="{{fixes}}" as="f" hint-placeholder-count="8">
      <div style="background: #17191E; border: 1px solid {{f.ln}}; border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 5px">
        <div style="display: flex; align-items: center; gap: 8px"><span class="n" style="font-size: 10px; font-weight: 700; color: #15180F; background: {{f.tc}}; border-radius: 4px; padding: 0 5px">{{f.tag}}</span><b>{{f.t}}</b></div>
        <span style="font-size: 11px; color: #8B919C; line-height: 1.45">{{f.now}}</span>
        <span style="font-size: 11px; color: #C9D6B0; line-height: 1.45">{{f.fix}}</span>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":860,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const bug = { tag: 'BUG', tc: '#F59AA6', ln: '#5C2A33' }, fix = { tag: 'FIX', tc: '#B8F04A', ln: '#2C3038' }, add = { tag: 'NEW', tc: '#8FE6B4', ln: '#2C3038' };
    const f = (s, t, now, fx) => Object.assign({ t, now: 'Today: ' + now, fix: fx }, s);
    return {
      fixes: [
        f(bug, 'One relay owner', 'every open backtester tab answers a GMGN call → 2 AG tabs = the buy is sent twice.', 'One tab holds a relay lease, others stay on standby; calls carry an id and are executed once.'),
        f(fix, 'Ack, then result', 'GMGN waits up to 20 s if the AG tab is frozen, then gives up.', 'The relay acks in a few ms. No ack in 1.2 s → go direct right away (safe: it never ran). Acked → wait, never resend.'),
        f(add, 'Real ping', 'a heartbeat timestamp only says a tab exists.', 'Ping / pong every 5 s → round-trip ms, tab visible / frozen, script version on each side.'),
        f(add, 'AG session check', 'an expired login shows up as failed buys.', 'Relay checks wallets-list every 60 s; 401 → red footbar “Log in”, buttons say why before you click.'),
        f(fix, 'Socket watchdog', 'socket.io reconnects, but a silent “connected” socket is not caught.', 'No event for 60 s on a subscribed coin → force reconnect with backoff, resubscribe, count reconnects.'),
        f(add, 'Auto re-open', 'if Chrome discards or you close the AG tab, orders stop.', 'Opt-in: re-open the backtester in a background tab when the relay is gone for 30 s (and only once a minute).'),
        f(add, 'Version check', 'after a script update the other tab still runs the old code.', 'Both tabs report their version; mismatch → amber “Reload AG tab (3.4 → 3.5)”.'),
        f(add, 'Health footbar', 'one small “synced 2s ago” label.', 'Relay · AG · Feed · Orders, one dot each; click for details, last events and quick actions.'),
      ],
    };
  }
}
</script>
</body>
</html>
