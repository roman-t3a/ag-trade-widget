name: Release

# Push a tag like v3.5.1 → run every check, then publish a GitHub release with the userscript attached.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tag matches the script version
        run: |
          v=$(sed -n 's#^// @version *##p' ag-trade-widget.user.js)
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME ≠ @version $v"; exit 1; }
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Release notes from CHANGELOG.md
        run: |
          v=${GITHUB_REF_NAME#v}
          awk -v v="$v" '$0 ~ "^## "v"$" {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          printf '\n**Install:** open the attached `ag-trade-widget.user.js` with Tampermonkey installed. Updates arrive automatically.\n' >> notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ag-trade-widget.user.js --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
